<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />

        <title>Application</title>
        <meta
            name="description"
            content="Application description."
        />
        <meta
            name="application-name"
            content="Application"
        />
        <meta
            name="color-scheme"
            content="only light"
        />
        <meta
            name="theme-color"
            content="#ffffff"
        />

        <link
            rel="canonical"
            href="{{ PUBLIC_URL }}"
        />

        <meta
            property="og:type"
            content="website"
        />
        <meta
            property="og:site_name"
            content="Application"
        />
        <meta
            property="og:title"
            content="Application"
        />
        <meta
            property="og:description"
            content="Application description."
        />
        <meta
            property="og:url"
            content="{{ PUBLIC_URL }}"
        />
        <meta
            property="og:image"
            content="../build/open-graph/open-graph.png"
        />
        <meta
            property="og:image:secure_url"
            content="../build/open-graph/open-graph.png"
        />
        <meta
            property="og:image:type"
            content="image/png"
        />
        <meta
            property="og:image:width"
            content="1200"
        />
        <meta
            property="og:image:height"
            content="630"
        />
        <meta
            property="og:image:alt"
            content="Application preview"
        />
        <meta
            property="og:locale"
            content="en_US"
        />

        <meta
            name="twitter:card"
            content="summary_large_image"
        />
        <meta
            name="twitter:title"
            content="Application"
        />
        <meta
            name="twitter:description"
            content="Application description."
        />
        <meta
            name="twitter:image"
            content="../build/open-graph/open-graph.png"
        />
        <meta
            name="twitter:image:alt"
            content="Application preview"
        />

        <meta
            name="apple-mobile-web-app-capable"
            content="yes"
        />
        <meta
            name="apple-mobile-web-app-title"
            content="Application"
        />

        <link
            rel="icon"
            type="image/vnd.microsoft.icon"
            sizes="16x16 32x32 48x48"
            href="../build/favicons/favicon.ico"
        />

        <link
            rel="icon"
            type="image/png"
            sizes="96x96"
            href="../build/favicons/favicon-96x96.png"
        />

        <link
            rel="icon"
            type="image/svg+xml"
            sizes="any"
            href="../build/favicons/favicon.svg"
        />

        <link
            rel="apple-touch-icon"
            type="image/png"
            sizes="180x180"
            href="../build/favicons/apple-touch-icon.png"
        />

        <link
            rel="manifest"
            href="./manifest.webmanifest"
        />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebSite",
                "@id": "https://example.com/#website",
                "description": "Application description.",
                "inLanguage": "en",
                "name": "Application",
                "url": "https://example.com/"
            }
        </script>
    </head>
    <body></body>
</html>
